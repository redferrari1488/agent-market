# HTTP: ACME challenge + redirect domain to HTTPS
server {
    listen 80;
    server_name hireon.agency www.hireon.agency;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://hireon.agency$request_uri;
    }
}

# HTTP fallback: direct IP access (for debugging)
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS: www -> apex canonical
server {
    listen 443 ssl;
    http2 on;
    server_name www.hireon.agency;

    ssl_certificate /etc/letsencrypt/live/hireon.agency/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hireon.agency/privkey.pem;

    return 301 https://hireon.agency$request_uri;
}

# HTTPS: main site
server {
    listen 443 ssl;
    http2 on;
    server_name hireon.agency;

    ssl_certificate /etc/letsencrypt/live/hireon.agency/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hireon.agency/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10M;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
