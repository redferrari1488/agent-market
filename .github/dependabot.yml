version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "next"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react-dom"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "drizzle-orm"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/agents-src/ai-support-bot"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/agents-src/competitor-monitor"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/agents-src/content-writer"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/agents-src/news-digest-bot"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/agents-src/review-responder-2gis"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/agents-src/website-monitor"
    schedule:
      interval: "weekly"
