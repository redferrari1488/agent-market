services:
  # tecnativa/docker-socket-proxy — HTTP-прокси для Docker API с минимальными
  # правами. app ходит к нему через DOCKER_HOST=tcp://socket-proxy:2375 вместо
  # прямого bind /var/run/docker.sock — закрывает host-escape через
  # rw-сокет (compromise app != root на хосте). Образ pinned by digest.
  socket-proxy:
    image: tecnativa/docker-socket-proxy@sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      # Минимальный scope для dockerode (src/lib/docker.ts): create/inspect/
      # stop/restart/remove/logs контейнеров + volumes + подключение к network.
      CONTAINERS: 1
      IMAGES: 1
      VOLUMES: 1
      NETWORKS: 1
      INFO: 1
      POST: 1
      # Все остальные ручки (BUILD/SYSTEM/EXEC/TASKS/SERVICES/SWARM/SECRETS/
      # CONFIGS/AUTH/DISTRIBUTION/NODES/PLUGINS/SESSION) — denied by default.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-tier
    # read_only: true перетирает /usr/local/etc/haproxy/haproxy.cfg.template
    # tmpfs'ом — entrypoint падает на sed. Без read_only защита всё равно есть:
    # cap_drop ALL + no-new-privileges + internal network + минимальный API scope.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # haproxy внутри образа требует setuid/setgid для bind на :2375.
      - SETUID
      - SETGID

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: agentmarket
      POSTGRES_USER: agentmarket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migration.sql:/docker-entrypoint-initdb.d/01-migration.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentmarket"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
      socket-proxy:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://agentmarket:${POSTGRES_PASSWORD:-changeme}@postgres:5432/agentmarket
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL:-}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      YOOKASSA_WEBHOOK_SECRET: ${YOOKASSA_WEBHOOK_SECRET:-}
      YOOKASSA_IP_CHECK: ${YOOKASSA_IP_CHECK:-}
      NOWPAYMENTS_API_KEY: ${NOWPAYMENTS_API_KEY:-}
      NOWPAYMENTS_IPN_SECRET: ${NOWPAYMENTS_IPN_SECRET:-}
      CRON_SECRET: ${CRON_SECRET}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Docker API доступ — только через socket-proxy. На хосте сокет больше
      # не bind'ится в этот контейнер.
      DOCKER_HOST: tcp://socket-proxy:2375
      # Agent-контейнеры подключаются в отдельную bridge-сеть, изолированную
      # от postgres (см. networks ниже). src/lib/docker.ts читает это.
      AGENT_NETWORK: ${AGENT_NETWORK:-agent-market_agents}
    networks:
      - default
      - socket-tier
    ports:
      - "127.0.0.1:3000:3000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    networks:
      - default
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot-www:/var/www/certbot:ro

networks:
  default:
    # app + postgres + nginx. Имя зафиксировано, чтобы не зависеть от compose
    # project-name (раньше создавалась как agent-market_default).
    name: agent-market_default
  socket-tier:
    # app ↔ socket-proxy. internal=true → у socket-proxy нет outbound,
    # compromise app не даст proxy ходить в интернет.
    internal: true
  agents:
    # bridge для agent-контейнеров. Создаётся compose'ом, чтобы docker.ts
    # мог подключать к ней контейнеры через NetworkingConfig.
    # Не internal — агентам нужен outbound к Telegram/OpenRouter/etc.
    # postgres в эту сеть НЕ подключён.
    name: agent-market_agents

volumes:
  pgdata:
