services:
  bot:
    build:
      context: ..
      dockerfile: news-digest-bot/Dockerfile
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      CHANNEL_ID: ${CHANNEL_ID}
      RSS_FEEDS: ${RSS_FEEDS}
      TONE: ${TONE}
      FETCH_INTERVAL_MINUTES: ${FETCH_INTERVAL_MINUTES:-60}
      MAX_POSTS_PER_CYCLE: ${MAX_POSTS_PER_CYCLE:-5}
      AI_PROVIDER: ${AI_PROVIDER:-claude}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-anthropic/claude-sonnet-4-6}
    volumes:
      - news_digest_data:/data
    mem_limit: 1g
    cpus: 1.0

volumes:
  news_digest_data:
